name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --nologo -v q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hds-finance-api api
      - name: Sobe o contêiner e gera um PDF de verdade
        run: |
          docker run -d --name api -p 8080:8080 -e Cors__OrigensPermitidas__0=http://localhost hds-finance-api
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf -o relatorio.pdf -F "arquivo=@api/tests/samples/inter-extrato.ofx" localhost:8080/demonstracao/relatorio
          head -c 5 relatorio.pdf | grep -q '%PDF-'
      - if: failure()
        run: docker logs api
