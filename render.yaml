# Blueprint do Render: a api (demonstração e área admin) em Docker, no plano gratuito.
# Os valores marcados com sync: false são preenchidos no painel, nunca aqui.
services:
  - type: web
    name: hds-finance-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: Cors__OrigensPermitidas__0
        sync: false
      # A área admin só liga com o e-mail do admin e a conexão do Neon preenchidos.
      - key: Admin__Email
        sync: false
      - key: ConnectionStrings__Banco
        sync: false
      - key: Admin__ChaveDeAssinatura
        generateValue: true
      - key: Email__Destinatario
        sync: false
      - key: Email__ChaveDaApi
        sync: false
      - key: Email__Remetente
        sync: false
